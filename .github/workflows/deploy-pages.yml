# Static preview on GitHub Pages (client assets only — no SSR server)
name: Deploy static preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: bun run build
        env:
          # Public keys only — optional secrets for a closer preview
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r .output/public/. site/
          CSS=$(basename "$(ls site/assets/styles-*.css | head -n 1)")
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>data smart — 정적 미리보기</title>
            <link rel="icon" href="./favicon.ico" />
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
            <link rel="stylesheet" href="./assets/${CSS}" />
            <style>
              body { margin: 0; font-family: "Pretendard Variable", Pretendard, sans-serif; background: #0f172a; color: #f8fafc; }
              .hero { width: 100%; display: block; max-height: 70vh; object-fit: cover; }
              .wrap { max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
              .brand { font-size: 1.25rem; font-weight: 800; }
              .brand span { color: #38bdf8; }
              h1 { margin: 1rem 0 0.5rem; font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 800; }
              p { color: rgba(248,250,252,0.7); line-height: 1.6; }
              .note { margin-top: 1.5rem; padding: 1rem 1.25rem; border: 1px solid rgba(248,250,252,0.15); border-radius: 0.75rem; background: rgba(248,250,252,0.05); font-size: 0.9rem; }
              .links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
              .links a { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
              .links a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <img class="hero" src="./images/datasmart-hero.jpg" alt="data smart" />
            <main class="wrap">
              <div class="brand">data<span> smart</span></div>
              <h1>정적 미리보기 (GitHub Pages)</h1>
              <p>
                GitHub Actions로 빌드·배포된 정적 화면입니다.
                이 프로젝트의 전체 기능(SSR·관리자·문의 저장 등)은 서버가 필요하므로
                Cloudflare / Lovable 등에서 배포해야 완전히 동작합니다.
              </p>
              <div class="note">
                아래는 저장소에 포함된 정적 자산(히어로 이미지·스타일)을 사용한 미리보기입니다.
                Actions 탭에서 이 워크플로가 성공(초록)인지 확인할 수 있습니다.
              </div>
              <div class="links">
                <a href="https://github.com/Uchang-Park/datasmart">GitHub 저장소</a>
                <a href="./images/ceo.jpg">대표 사진</a>
                <a href="./robots.txt">robots.txt</a>
              </div>
            </main>
          </body>
          </html>
          EOF
          cp site/index.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
